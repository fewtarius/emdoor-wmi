#
# DKMS configuration for emdoor-wmi
#
# This file is used by DKMS to build and install the emdoor-wmi kernel module
# across kernel updates. The module provides power management, fan control,
# battery charge thresholds, and keyboard RGB for Emdoor EmdAcpi firmware.

PACKAGE_NAME="emdoor-wmi"
PACKAGE_VERSION="@PKGVER@"

BUILT_MODULE_NAME[0]="emdoor-wmi"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86"

MAKE[0]="KERNELRELEASE=${kernelver} make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"

CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

AUTOINSTALL="yes"

REMAKE_INITRD="yes"